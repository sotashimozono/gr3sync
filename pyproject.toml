[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gr3sync"
version = "0.1.0"
description = "Pull photos off a RICOH GR III over Bluetooth + Wi-Fi, without touching the camera"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ricoh", "gr3", "griii", "camera", "bluetooth", "ble", "photo", "sync"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
]
# The Wi-Fi half is standard library only, on purpose: it has to be droppable
# onto whatever machine happens to be near the camera.
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gr3sync = "gr3sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gr3sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Long, explanatory error strings read better inline than hoisted to a name.
  "EM101",
  "EM102",
]
