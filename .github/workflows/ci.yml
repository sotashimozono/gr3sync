name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # btleplug's Linux backend links against libdbus; macOS uses
      # CoreBluetooth and needs nothing extra.
      - name: Install libdbus
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The binary has to be usable on a machine that has never seen this project,
  # which is the entire reason for shipping one static executable. Building it
  # for real — and checking the subcommands that need no camera actually run —
  # is what keeps that true.
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --release
      - run: ./target/release/gr3sync --help
      - run: ./target/release/gr3sync backends
      - run: ./target/release/gr3sync config
      - name: A host with no Bluetooth must get advice, not a panic
        run: |
          set +e
          output=$(./target/release/gr3sync scan --timeout 1 2>&1)
          status=$?
          echo "$output"
          [ "$status" -eq 2 ] || { echo "expected exit 2, got $status"; exit 1; }
          case "$output" in
            *panicked*) echo "a panic reached the user"; exit 1 ;;
          esac
      - name: Report the binary size
        run: ls -lh target/release/gr3sync
