name: typos

# Cheap guard on a repository whose value is largely in its prose: the
# README's verification status, the emulator's "what this does not prove"
# caveats, and the error messages users are supposed to act on.
#
# To allow a flagged word, add it under [default.extend-words] in .typos.toml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89     # v1.47.2
